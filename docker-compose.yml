
services:
  # PHP + Apache
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    networks:
      - app-network
  
  # mysql
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: mijn_database
      MYSQL_ROOT_PASSWORD: wachtwoord
    networks:
      - app-network
    volumes:
      - db_data:/var/lib/mysql
      - ./docker_init:/docker-entrypoint-initdb.d
  
  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports: 
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=wachtwoord
    networks:
      - app-network
    depends_on:
      - db

volumes:
  db_data:

networks:
  app-network:
    driver: bridge